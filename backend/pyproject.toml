[project]
name = "ai-reading-assistant-backend"
version = "0.1.0"
description = "RAG-based AI reading assistant backend"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9,<2",
    "fastapi>=0.115.0,<0.130.0",
    "google-genai>=3.3.0,<4",
    "httpx>=0.27.0,<0.29.0",
    "httpx2>=2.16.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5.1.2,<6",
    "uvicorn[standard]>=0.30.0,<0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<0.29.0",
    "pytest>=8.3.0,<9",
    "ruff>=0.9.0,<1",
]

[tool.uv]
package = false
constraint-dependencies = [
    "cryptography>=38.0.3,<44",
    "numpy>=1.26,<2",
    "onnxruntime>=1.14.1,<1.17",
    "transformers>=4.41,<5",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
